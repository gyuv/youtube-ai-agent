name: Pinterest worker

# Every 15 minutes (and by hand from the Actions tab), find video Pins for scenes queued with the
# "Pinterest" visual source: cloud/pinterest/pinterest_source.py --worker --once claims each
# queued search, downloads the first video Pin, uploads it through a signed URL and reports back,
# then exits when the queue is empty. A quick check first skips the browser install when nothing
# is waiting, so an idle run costs seconds.
#
# Repository secrets (Settings -> Secrets and variables -> Actions):
#   APP_URL                   https URL of the deployed studio (same as render-video.yml)
#   PINTEREST_WORKER_SECRET   same value as in Vercel (32+ random characters)
#
# Pinterest may block or rate-limit GitHub's datacenter IPs more than a home connection; failed
# searches show on the scene card. GitHub runs schedules from the default branch only, may start
# them some minutes late, and pauses them after 60 days without repository activity.

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

# One worker at a time; a scheduled run waits for a long one instead of racing it for claims.
concurrency:
  group: pinterest-worker
  cancel-in-progress: false

jobs:
  work:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      LUMEN_URL: ${{ secrets.APP_URL }}
      PINTEREST_WORKER_SECRET: ${{ secrets.PINTEREST_WORKER_SECRET }}
    steps:
      - name: Check for queued searches
        id: pending
        run: |
          set -uo pipefail
          if [[ -z "$LUMEN_URL" || -z "$PINTEREST_WORKER_SECRET" ]]; then
            echo "::warning::Skipping: add the APP_URL and PINTEREST_WORKER_SECRET repository secrets to turn on the Pinterest worker"
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=$(curl -sS -o pending.json -w "%{http_code}" --max-time 60 \
            -H "Authorization: Bearer $PINTEREST_WORKER_SECRET" "${LUMEN_URL%/}/api/pinterest/pending") || code=000
          if [[ "$code" != 200 ]]; then
            echo "::error::Pending check returned HTTP $code: $(head -c 300 pending.json 2>/dev/null)"
            exit 1
          fi
          pending=$(jq -r '.pending // 0' pending.json)
          echo "Queued Pinterest searches: $pending"
          echo "count=$pending" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.pending.outputs.count != '0'

      - uses: actions/setup-python@v5
        if: steps.pending.outputs.count != '0'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cloud/pinterest/requirements.txt

      - name: Install the worker
        if: steps.pending.outputs.count != '0'
        run: |
          pip install -r cloud/pinterest/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Process the queue
        if: steps.pending.outputs.count != '0'
        run: python cloud/pinterest/pinterest_source.py --worker --once
