name: Autopilot

# Every 3 hours, and on demand from the studio's "Run now" button, keep asking the app for the
# next autopilot step until it reports there is nothing left to do. Each call is one small step
# (plan, script, fill a scene, dispatch a render); see cloud/src/services/autopilot.ts.
#
# Needs no checkout or install, so a run costs seconds of runner time. Uses the same repository
# secrets as render-video.yml: APP_URL and RENDER_WEBHOOK_SECRET.
#
# GitHub runs schedules from the default branch only, may start them some minutes late, and
# pauses them after 60 days without repository activity (public repositories).

on:
  schedule:
    - cron: "23 */3 * * *"
  repository_dispatch:
    types: [autopilot]
  workflow_dispatch:

permissions: {}

# One autopilot at a time; a second request waits for the first instead of racing it.
concurrency:
  group: autopilot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_URL: ${{ secrets.APP_URL }}
      RUNNER_SECRET: ${{ secrets.RENDER_WEBHOOK_SECRET }}
    steps:
      - name: Run autopilot steps until idle
        run: |
          set -uo pipefail
          if [[ -z "$APP_URL" || -z "$RUNNER_SECRET" ]]; then
            echo "::error::Add the APP_URL and RENDER_WEBHOOK_SECRET repository secrets"
            exit 1
          fi

          deadline=$((SECONDS + 35 * 60)) # stop well before timeout-minutes
          steps=0
          failures=0
          while (( SECONDS < deadline )); do
            code=$(curl -sS -o response.json -w "%{http_code}" --max-time 320 -X POST \
              -H "Authorization: Bearer $RUNNER_SECRET" "${APP_URL%/}/api/autopilot/tick") || code=000
            action=$(jq -r '.action // "unknown"' response.json 2>/dev/null || echo unknown)
            message=$(jq -r '.message // empty' response.json 2>/dev/null || true)
            more=$(jq -r '.more // false' response.json 2>/dev/null || echo false)
            steps=$((steps + 1))
            echo "[$action] $message"

            if [[ "$code" != 200 ]]; then
              failures=$((failures + 1))
              echo "::warning::Autopilot step returned HTTP $code"
              if (( failures >= 3 )); then
                echo "::error::Stopping after 3 failed calls in a row"
                exit 1
              fi
              sleep 20
              continue
            fi
            failures=0
            if [[ "$action" == error ]]; then echo "::warning::$message"; fi
            [[ "$more" == true ]] || break
          done
          echo "Autopilot finished after $steps step(s)."
